<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background circle with stud look -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="#1e293b" stroke="#000" stroke-width="4"/>
  <circle cx="25" cy="25" r="4" fill="#334155"/>
  <circle cx="75" cy="25" r="4" fill="#334155"/>
  <circle cx="25" cy="75" r="4" fill="#334155"/>
  <circle cx="75" cy="75" r="4" fill="#334155"/>
  <!-- Vibrant Egg -->
  <ellipse cx="50" cy="52" rx="26" ry="34" fill="url(#eggGrad)" stroke="#000" stroke-width="4" filter="url(#shadow)"/>
  <!-- Highlight -->
  <ellipse cx="42" cy="38" rx="7" ry="12" fill="#fff" opacity="0.4" transform="rotate(-20 42 38)"/>
  <!-- Star shine -->
  <path d="M 62 30 Q 64 34 68 36 Q 64 38 62 42 Q 60 38 56 36 Q 60 34 62 30 Z" fill="#ffe600" stroke="#000" stroke-width="1"/>
</svg>
